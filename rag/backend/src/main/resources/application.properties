
spring.application.name=rag-backend

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rag_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:rag_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Storage
rag.storage-directory=${RAG_STORAGE_DIRECTORY:/rag-backend/rag-files}
rag.chunk-size-chars=${RAG_CHUNK_SIZE_CHARS:1200}
rag.chunk-overlap-chars=${RAG_CHUNK_OVERLAP_CHARS:200}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
ollama.embedding-dimension=${OLLAMA_EMBEDDING_DIMENSION:1024}
ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:90000}
ollama.batch-size=${OLLAMA_BATCH_SIZE:10}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
